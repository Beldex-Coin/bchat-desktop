<svg xmlns="http://www.w3.org/2000/svg" width="700" height="364" viewBox="0 0 700 364" fill="none">
  <!-- Empty conversation artwork, white theme (Figma 5808:30210, redrawn as vector): two people
       linked through an encrypted cube. Transparent background so the page's dot grid shows through. -->
  <defs>
    <linearGradient id="face-l" x1="268" y1="127" x2="350" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9c9c9"/>
      <stop offset="1" stop-color="#b9b9b9"/>
    </linearGradient>
    <linearGradient id="face-r" x1="432" y1="127" x2="350" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4c4c4"/>
      <stop offset="1" stop-color="#b5b5b5"/>
    </linearGradient>
    <linearGradient id="face-t" x1="350" y1="93" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6d6d6"/>
      <stop offset="1" stop-color="#c6c6c6"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#c4c4c4"/>
      <stop offset="1" stop-color="#b0b0b0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- quadrant arcs around the cube -->
  <g stroke="#c4c4c4" stroke-width="1.5" stroke-linecap="round">
    <path d="M250 93A148 148 0 0 1 328 36"/>
    <path d="M372 36A148 148 0 0 1 450 93"/>
    <path d="M250 271A148 148 0 0 0 328 328"/>
    <path d="M372 328A148 148 0 0 0 450 271"/>
  </g>
  <g fill="#b5b5b5">
    <circle cx="238" cy="103" r="4.5"/>
    <circle cx="462" cy="103" r="4.5"/>
    <circle cx="238" cy="256" r="4.5"/>
    <circle cx="462" cy="256" r="4.5"/>
  </g>

  <!-- vertical axis -->
  <path d="M350 25V93M350 270V330" stroke="#c4c4c4" stroke-width="1.5"/>
  <circle cx="350" cy="16" r="9" fill="#ffffff" stroke="#b5b5b5" stroke-width="2.5"/>
  <circle cx="350" cy="16" r="5" fill="#a8a8a8"/>
  <circle cx="350" cy="58" r="5" fill="#b5b5b5"/>
  <circle cx="350" cy="306" r="5" fill="#b5b5b5"/>
  <circle cx="350" cy="340" r="9" fill="#ffffff" stroke="#b5b5b5" stroke-width="2.5"/>
  <circle cx="350" cy="340" r="5" fill="#a8a8a8"/>

  <!-- links to the people -->
  <path d="M187 181.5H262M438 181.5H513" stroke="#c4c4c4" stroke-width="1.5"/>
  <circle cx="182" cy="181.5" r="4.5" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5"/>
  <circle cx="518" cy="181.5" r="4.5" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5"/>

  <!-- cube faces -->
  <path d="M268 127L350 160V270L268 240Z" fill="url(#face-l)" fill-opacity="0.85"/>
  <path d="M432 127L350 160V270L432 240Z" fill="url(#face-r)" fill-opacity="0.85"/>
  <path d="M268 127L350 93L432 127L350 160Z" fill="url(#face-t)" fill-opacity="0.85"/>
  <!-- inner (hidden) edges, dashed -->
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8" stroke-dasharray="3 3">
    <path d="M305 118L350 136L395 118"/>
    <path d="M305 142V255M395 142V255"/>
    <path d="M350 136V160"/>
    <path d="M285 134L350 110L415 134"/>
    <path d="M350 160V270"/>
  </g>
  <!-- outer edges -->
  <path d="M350 93L432 127V240L350 270L268 240V127Z" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M268 127L350 160L432 127" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1" stroke-linejoin="round"/>
  <g fill="url(#glow)">
    <circle cx="350" cy="93" r="6"/>
    <circle cx="432" cy="127" r="6"/>
    <circle cx="268" cy="127" r="6"/>
    <circle cx="350" cy="160" r="4"/>
    <circle cx="432" cy="240" r="6"/>
    <circle cx="268" cy="240" r="6"/>
    <circle cx="350" cy="270" r="6"/>
  </g>
  <!-- edge nodes where the links meet the cube -->
  <circle cx="268" cy="181.5" r="6.5" fill="#e6e6e6" stroke="#b5b5b5" stroke-width="1.5"/>
  <circle cx="432" cy="181.5" r="6.5" fill="#e6e6e6" stroke="#b5b5b5" stroke-width="1.5"/>

  <!-- lock -->
  <path d="M338.5 192V180.5C338.5 173.6 344.1 168 351 168C357.9 168 363.5 173.6 363.5 180.5V192" stroke="#f4f4f4" stroke-width="4.5"/>
  <rect x="329" y="190" width="44" height="32" rx="4" fill="#f4f4f4"/>
  <circle cx="351" cy="203" r="4.2" fill="#a8a8a8"/>
  <path d="M349.2 205H352.8L353.6 213.5H348.4Z" fill="#a8a8a8"/>

  <!-- people: filled discs with a thin outer arc on the far side -->
  <path d="M128 127A55 55 0 0 0 128 237" stroke="#c4c4c4" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M572 127A55 55 0 0 1 572 237" stroke="#c4c4c4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="125" cy="182" r="45" fill="url(#disc)"/>
  <circle cx="575" cy="182" r="45" fill="url(#disc)"/>
  <g stroke="#f4f4f4" stroke-width="1.6" stroke-linecap="round">
    <circle cx="125" cy="170" r="12.5"/>
    <path d="M100 207C101.5 194 112 186 125 186C138 186 148.5 194 150 207"/>
    <circle cx="575" cy="170" r="12.5"/>
    <path d="M550 207C551.5 194 562 186 575 186C588 186 598.5 194 600 207"/>
  </g>
  <circle cx="154" cy="212" r="7" fill="#b0b0b0" stroke="#f4f4f4" stroke-width="2.5"/>
  <circle cx="604" cy="212" r="7" fill="#b0b0b0" stroke="#f4f4f4" stroke-width="2.5"/>
</svg>
