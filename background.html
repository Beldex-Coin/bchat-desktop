<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0"
      name="viewport"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'none';
    child-src 'self';
    connect-src 'self' https: wss: blob: data:;
    font-src 'self';
    form-action 'self';
    frame-src 'none';
    img-src 'self' blob: data:;
    media-src 'self' blob:;
    object-src 'none';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
  "
/>

    <title>BChat</title>
    <link href="images/bchat/bchat_icon_32.png" rel="shortcut icon" />
    <link href="stylesheets/manifest.css" rel="stylesheet" type="text/css" />
  </head>

  <body id="body">
    <div id="root">
      <div class="app-loading-screen">
        <div class="content bchat-full-logo">
          <!-- splash: Lottie animation (images/animations/Splash_desktop.json), drawn into this box -->
          <div id="bchat-splash" class="bchat-brand-logo"></div>
          <!-- <img src="images/bchat/BChat_text.svg"  width="400px" height="100px" /> -->
        </div>
      </div>
    </div>
    <script type="text/javascript">
      // Splash animation. It plays until the app replaces the loading screen, then is torn down
      // so it doesn't keep drawing frames in the background.
      try {
        const lottie = require('lottie-web');
        const splashBox = document.getElementById('bchat-splash');
        const splash = lottie.loadAnimation({
          container: splashBox,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: require('./images/animations/Splash_desktop.json'),
        });
        const stopSplash = new MutationObserver(() => {
          if (!document.body.contains(splashBox)) {
            splash.destroy();
            stopSplash.disconnect();
          }
        });
        stopSplash.observe(document.getElementById('root'), { childList: true, subtree: true });
      } catch (e) {
        console.warn('splash animation could not start', e);
      }
      require('./ts/mains/main_renderer.js');
    </script>
  </body>
</html>
