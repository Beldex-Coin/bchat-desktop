<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0"
      name="viewport"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'none';
    child-src 'self';
    connect-src 'self' https: wss: blob: data:;
    font-src 'self';
    form-action 'self';
    frame-src 'none';
    img-src 'self' blob: data:;
    media-src 'self' blob:;
    object-src 'none';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
  "
/>

    <title>BChat</title>
    <link href="images/bchat/bchat_icon_32.png" rel="shortcut icon" />
    <link href="stylesheets/manifest.css" rel="stylesheet" type="text/css" />
  </head>

  <body id="body">
    <div id="root"></div>
    <!-- splash: Lottie animation (images/animations/Splash_desktop.json). It sits over the app (outside
         #root, so React does not replace it) until it has played through once and the app is ready -->
    <div
      id="bchat-splash-screen"
      class="app-loading-screen"
      style="position: fixed; z-index: 100000; transition: opacity 0.3s ease"
    >
      <div class="content bchat-full-logo">
        <div id="bchat-splash" class="bchat-brand-logo"></div>
      </div>
    </div>
    <script type="text/javascript">
      (function startSplash() {
        const screen = document.getElementById('bchat-splash-screen');
        const root = document.getElementById('root');
        let splash;
        let played = false;
        let appReady = false;
        let closed = false;

        const close = () => {
          if (closed || !played || !appReady) {
            return;
          }
          closed = true;
          screen.style.opacity = '0';
          setTimeout(() => {
            if (splash) {
              splash.destroy();
            }
            screen.remove();
          }, 300);
        };

        try {
          const lottie = require('lottie-web');
          splash = lottie.loadAnimation({
            container: document.getElementById('bchat-splash'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            animationData: require('./images/animations/Splash_desktop.json'),
          });
          // keeps looping while the app is still loading; closes at the end of a full play
          splash.addEventListener('loopComplete', () => {
            played = true;
            close();
          });
        } catch (e) {
          console.warn('splash animation could not start', e);
          played = true;
        }

        // the app is ready once it has rendered into #root
        const watchApp = new MutationObserver(() => {
          if (root.childElementCount > 0) {
            watchApp.disconnect();
            appReady = true;
            close();
          }
        });
        watchApp.observe(root, { childList: true });
      })();
      require('./ts/mains/main_renderer.js');
    </script>
  </body>
</html>
