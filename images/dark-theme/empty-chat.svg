<svg xmlns="http://www.w3.org/2000/svg" width="700" height="364" viewBox="0 0 700 364" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Empty conversation artwork (Figma 168:8449, redrawn as vector): two people linked through an
       encrypted cube. Transparent background so the page's dot grid shows through. -->
  <defs>
    <linearGradient id="face-l" x1="268" y1="127" x2="350" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="face-r" x1="432" y1="127" x2="350" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="face-t" x1="350" y1="93" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="350" cy="182" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="350" cy="182" r="140" fill="url(#halo)"/>

  <!-- vertical axis -->
  <path d="M350 26V86M350 278V330" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="350" cy="16" r="8.5" stroke="#555" stroke-width="1.5"/>
  <circle cx="350" cy="16" r="4.5" fill="#777"/>
  <circle cx="350" cy="58" r="5" stroke="#4a4a4a" stroke-width="1.2"/>
  <circle cx="350" cy="306" r="5" stroke="#4a4a4a" stroke-width="1.2"/>
  <circle cx="350" cy="340" r="8.5" stroke="#555" stroke-width="1.5"/>
  <circle cx="350" cy="340" r="4.5" fill="#777"/>

  <!-- faint corner rings -->
  <g stroke="#3d3d3d" stroke-width="1.2">
    <circle cx="238" cy="103" r="4.5"/>
    <circle cx="462" cy="103" r="4.5"/>
    <circle cx="238" cy="256" r="4.5"/>
    <circle cx="462" cy="256" r="4.5"/>
  </g>

  <!-- links to the people -->
  <path d="M182 181.5H268M432 181.5H518" stroke="#4d4d4d" stroke-width="1.2"/>
  <circle cx="182" cy="181.5" r="4.5" fill="#6d6d6d"/>
  <circle cx="518" cy="181.5" r="4.5" fill="#6d6d6d"/>

  <!-- cube faces -->
  <path d="M268 127L350 160V270L268 240Z" fill="url(#face-l)"/>
  <path d="M432 127L350 160V270L432 240Z" fill="url(#face-r)"/>
  <path d="M268 127L350 93L432 127L350 160Z" fill="url(#face-t)"/>
  <!-- inner (hidden) edges, dashed -->
  <g stroke="#9a9a9a" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="3 3">
    <path d="M305 118L350 136L395 118"/>
    <path d="M305 142V255M395 142V255"/>
    <path d="M350 136V160"/>
    <path d="M285 134L350 110L415 134"/>
  </g>
  <!-- outer edges -->
  <path d="M350 93L432 127V240L350 270L268 240V127Z" stroke="#b5b5b5" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M268 127L350 160L432 127" stroke="#b5b5b5" stroke-opacity="0.35" stroke-width="1" stroke-linejoin="round"/>
  <path d="M350 160V270" stroke="#9a9a9a" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- glowing vertices -->
  <g fill="url(#glow)">
    <circle cx="350" cy="93" r="6"/>
    <circle cx="432" cy="127" r="6"/>
    <circle cx="268" cy="127" r="6"/>
    <circle cx="350" cy="160" r="3.5"/>
    <circle cx="432" cy="240" r="6"/>
    <circle cx="268" cy="240" r="6"/>
    <circle cx="350" cy="270" r="6"/>
  </g>
  <!-- edge nodes where the links meet the cube -->
  <circle cx="268" cy="181.5" r="5.5" fill="#7a7a7a"/>
  <circle cx="432" cy="181.5" r="5.5" fill="#7a7a7a"/>

  <!-- lock -->
  <path d="M338.5 192V180.5C338.5 173.6 344.1 168 351 168C357.9 168 363.5 173.6 363.5 180.5V192" stroke="#8f8f8f" stroke-width="4.5"/>
  <rect x="329" y="190" width="44" height="32" rx="4" fill="#8f8f8f"/>
  <circle cx="351" cy="203" r="4.2" fill="#2a2a2a"/>
  <path d="M349.2 205H352.8L353.6 213.5H348.4Z" fill="#2a2a2a"/>

  <!-- people -->
  <g stroke="#5a5a5a" stroke-width="1.5">
    <circle cx="125" cy="182" r="45"/>
    <circle cx="575" cy="182" r="45"/>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round">
    <circle cx="125" cy="170" r="12.5"/>
    <path d="M100 207C101.5 194 112 186 125 186C138 186 148.5 194 150 207"/>
    <circle cx="575" cy="170" r="12.5"/>
    <path d="M550 207C551.5 194 562 186 575 186C588 186 598.5 194 600 207"/>
  </g>
  <circle cx="154" cy="212" r="7" fill="#6d6d6d" stroke="#141414" stroke-width="2"/>
  <circle cx="604" cy="212" r="7" fill="#6d6d6d" stroke="#141414" stroke-width="2"/>
</svg>
